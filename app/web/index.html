<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoHitRate</title>
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/theme.css" />
  </head>
  <body>
    <div class="container">
      <!-- header: title and theme toggle -->
      <header>
        <div class="header-top">
          <div>
            <h1>GoHitRate</h1>
            <p>Zero-install local API load tester</p>
          </div>
          <div class="pill-toggle" id="theme-toggle">
            <span class="pill-option" id="toggle-dark">☾</span>
            <span class="pill-option" id="toggle-light">☼</span>
            <span class="pill-highlight" id="pill-highlight"></span>
          </div>
        </div>
      </header>

      <main>
        <!-- test configuration form -->
        <section class="config">
          <h2>Test Configuration</h2>

          <!-- target url -->
          <div class="field">
            <label for="url">Target URL</label>
            <input
              type="text"
              id="url"
              placeholder="http://localhost:3000/api/endpoint"
            />
          </div>

          <!-- http method -->
          <div class="field">
            <label for="method">Method</label>
            <select id="method">
              <option>GET</option>
              <option>POST</option>
              <option>PUT</option>
              <option>PATCH</option>
              <option>DELETE</option>
            </select>
          </div>

          <!-- optional request payload: headers and body -->
          <div class="field">
            <button class="payload-toggle" id="payload-toggle">
              ▶ Request Payload (optional)
            </button>
            <div class="payload-content" id="payload-content">
              <div id="headers-list">
                <label>Headers</label>
              </div>
              <button class="add-header" id="add-header">+ Add Header</button>
              <div class="field">
                <label for="body">Request Body (JSON)</label>
                <textarea id="body" placeholder='{"key": "value"}'></textarea>
              </div>
            </div>
          </div>

          <!-- load test parameters -->
          <div class="field-row">
            <div class="field">
              <label for="rps">Requests per second</label>
              <input type="number" id="rps" value="10" />
            </div>
            <div class="field">
              <label for="duration">Duration (seconds)</label>
              <input type="number" id="duration" value="10" />
            </div>
          </div>

          <p id="request-summary" class="summary"></p>
          <button id="start">Run Test</button>
        </section>

        <!-- results section: populated by results.js after test completes -->
        <section class="results">
          <h2>Results</h2>
          <p class="placeholder">
            Results will appear here after running a test.
          </p>
        </section>
      </main>
    </div>

    <!-- scripts loaded in dependency order -->
    <script src="scripts/graph.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/results.js"></script>
    <script src="scripts/index.js"></script>
  </body>
</html>
