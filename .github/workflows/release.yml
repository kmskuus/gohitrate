name: Release

on:
  push:
    tags:
      - "v*"

# Grants this specific workflow permission to create a release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
          cache-dependency-path: app/go.sum

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Windows
        working-directory: app
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/gohitrate-windows-amd64.exe .

      - name: Build macOS Intel
        working-directory: app
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/gohitrate-macos-amd64 .

      - name: Build macOS ARM64
        working-directory: app
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/gohitrate-macos-arm64 .

      - name: Build Linux (Static)
        working-directory: app
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/gohitrate-linux-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gohitrate-windows-amd64.exe
            dist/gohitrate-macos-amd64
            dist/gohitrate-macos-arm64
            dist/gohitrate-linux-amd64
          generate_release_notes: true
