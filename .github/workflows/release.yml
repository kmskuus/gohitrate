name: Release

on:
  push:
    tags:
      - "v*"

# Grants this specific workflow permission to create a release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: app/go.sum

      - name: Vet
        working-directory: app
        run: go vet ./...

      - name: Run tests
        working-directory: app
        run: go test ./...

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Windows
        working-directory: app
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/${{ github.event.repository.name }}-${{ github.ref_name }}-windows-amd64.exe .

      - name: Build macOS Intel
        working-directory: app
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/${{ github.event.repository.name }}-${{ github.ref_name }}-macos-amd64 .

      - name: Build macOS ARM64
        working-directory: app
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/${{ github.event.repository.name }}-${{ github.ref_name }}-macos-arm64 .

      - name: Build Linux (Static)
        working-directory: app
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/${{ github.event.repository.name }}-${{ github.ref_name }}-linux-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ github.event.repository.name }}-${{ github.ref_name }}-windows-amd64.exe
            dist/${{ github.event.repository.name }}-${{ github.ref_name }}-macos-amd64
            dist/${{ github.event.repository.name }}-${{ github.ref_name }}-macos-arm64
            dist/${{ github.event.repository.name }}-${{ github.ref_name }}-linux-amd64
          generate_release_notes: true
